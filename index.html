<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      height: fit-content;
      overflow: hidden;
    }

    .header {
      background: #4f46e5;
      color: #fff;
      padding: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header .stats {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #4f46e5;
    }

    .btn-add {
      padding: 10px 18px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-add:hover { background: #4338ca; }
    .btn-add:active { transform: scale(0.95); }

    .filter-bar {
      display: flex;
      gap: 6px;
      padding: 12px 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .filter-btn {
      padding: 5px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 20px;
      background: #fff;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      color: #6b7280;
      font-weight: 500;
    }

    .filter-btn.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #fff;
    }

    .list {
      list-style: none;
      min-height: 60px;
      max-height: 420px;
      overflow-y: auto;
    }

    .list::-webkit-scrollbar { width: 6px; }
    .list::-webkit-scrollbar-track { background: #f9fafb; }
    .list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 40px 20px;
      font-size: 0.95rem;
    }

    .empty span { display: block; font-size: 2.5rem; margin-bottom: 8px; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid #f3f4f6;
      transition: background 0.15s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item:hover { background: #f9fafb; }

    .item.checked .item-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid #d1d5db;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .item.checked .checkbox {
      background: #4f46e5;
      border-color: #4f46e5;
    }

    .checkbox::after {
      content: '';
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .item.checked .checkbox::after { opacity: 1; }

    .item-text {
      flex: 1;
      font-size: 0.95rem;
      color: #1f2937;
      word-break: break-all;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover { color: #ef4444; background: #fef2f2; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-top: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .footer span { font-size: 0.82rem; color: #6b7280; }

    .btn-clear {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .btn-clear:hover { background: #fef2f2; }
    .btn-clear:disabled { color: #d1d5db; cursor: default; }
    .btn-clear:disabled:hover { background: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>🛒 쇼핑 리스트</h1>
      <div class="stats" id="stats">항목 없음</div>
    </div>

    <div class="input-area">
      <input type="text" id="input" placeholder="아이템을 입력하세요..." maxlength="50">
      <button class="btn-add" id="btn-add" title="추가">＋</button>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">미완료</button>
      <button class="filter-btn" data-filter="checked">완료</button>
    </div>

    <ul class="list" id="list"></ul>

    <div class="footer">
      <span id="footer-info"></span>
      <button class="btn-clear" id="btn-clear">완료 항목 삭제</button>
    </div>
  </div>

  <script>
    let items = JSON.parse(localStorage.getItem('shopping') || '[]');
    let filter = 'all';

    const listEl    = document.getElementById('list');
    const inputEl   = document.getElementById('input');
    const statsEl   = document.getElementById('stats');
    const footerEl  = document.getElementById('footer-info');
    const clearBtn  = document.getElementById('btn-clear');

    function save() {
      localStorage.setItem('shopping', JSON.stringify(items));
    }

    function render() {
      const filtered = items.filter(item => {
        if (filter === 'active')  return !item.checked;
        if (filter === 'checked') return item.checked;
        return true;
      });

      listEl.innerHTML = '';

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty"><span>🛍️</span>${
          filter === 'checked' ? '완료된 항목이 없어요' :
          filter === 'active'  ? '미완료 항목이 없어요' :
          '아이템을 추가해 보세요!'
        }</div>`;
      } else {
        filtered.forEach(item => {
          const li = document.createElement('li');
          li.className = 'item' + (item.checked ? ' checked' : '');
          li.dataset.id = item.id;
          li.innerHTML = `
            <div class="checkbox"></div>
            <span class="item-text">${escapeHtml(item.text)}</span>
            <button class="btn-delete" title="삭제">✕</button>
          `;
          li.querySelector('.checkbox').addEventListener('click', () => toggle(item.id));
          li.querySelector('.item-text').addEventListener('click', () => toggle(item.id));
          li.querySelector('.btn-delete').addEventListener('click', () => remove(item.id));
          listEl.appendChild(li);
        });
      }

      const total   = items.length;
      const checked = items.filter(i => i.checked).length;
      statsEl.textContent = total === 0 ? '항목 없음' : `${checked} / ${total} 완료`;
      footerEl.textContent = `총 ${total}개 항목`;
      clearBtn.disabled = checked === 0;
    }

    function add() {
      const text = inputEl.value.trim();
      if (!text) return;
      items.unshift({ id: Date.now(), text, checked: false });
      inputEl.value = '';
      save();
      render();
    }

    function toggle(id) {
      const item = items.find(i => i.id === id);
      if (item) { item.checked = !item.checked; save(); render(); }
    }

    function remove(id) {
      items = items.filter(i => i.id !== id);
      save();
      render();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.getElementById('btn-add').addEventListener('click', add);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    clearBtn.addEventListener('click', () => {
      items = items.filter(i => !i.checked);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
